# Checks for every push and pull request: types, lint, unit + integration tests (PGlite, no secrets), the schema
# is fully migrated, and the production build compiles. Nothing here touches a real database.
# Optional (repo owner): Settings → Branches → rule for `main` → «Require status checks to pass» → `checks`.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json → packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm exec eslint src tests scripts
      - name: Tests
        run: pnpm test
      - name: Schema and migrations agree
        run: |
          pnpm exec drizzle-kit generate --name ci_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts has changes without a migration — run pnpm db:generate and commit drizzle/"
            git status --porcelain drizzle
            exit 1
          fi
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Google Chrome is preinstalled on the runner (playwright.config.ts uses channel: 'chrome'); a local lab database
      # and fake auth, no secrets (tests/e2e)
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
