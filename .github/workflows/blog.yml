# Blog writer (docs/BLOG.md): generates articles from blog/topics.yaml and commits them to main → Vercel deploys.
# Secret: OPENAI_API_KEY (text on gpt-5.5 + illustrations). Optional: AI_GATEWAY_API_KEY with the BLOG_MODEL variable.
# Runs on its own on the days in the repo variable BLOG_DAYS (ISO weekdays, default '1,3,5' = Mon/Wed/Fri — a steady
# pace for a young domain; later '1,2,3,4,5' or '1,2,3,4,5,6,7'), BLOG_DAILY_COUNT articles each (default 1).
# BLOG_PAUSED = 'true' pauses it. Manual runs (Actions → blog → Run workflow) ignore the schedule. A failed run (e.g. no API credits) commits nothing and
# GitHub emails the owner; the topic stays in the queue for the next run.
name: blog

on:
  schedule:
    # every day, 06:20 UTC (≈ 8–9 am in Kyiv)
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many articles (1–5)'
        default: '1'
      category:
        description: 'Only this category (english, javascript, sql, system-design, german, learning) — empty = next in queue'
        required: false
      topic:
        description: 'Ad-hoc topic instead of the queue (needs category)'
        required: false

concurrency:
  group: blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  write:
    if: github.event_name == 'workflow_dispatch' || vars.BLOG_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      BLOG_MODEL: ${{ vars.BLOG_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Publishing day?
        id: day
        env:
          DAYS: ${{ vars.BLOG_DAYS || '1,3,5' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || echo ",$DAYS," | grep -q ",$(date -u +%u),"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a publishing day ($(date -u +%A)); BLOG_DAYS=$DAYS"
          fi
      - if: steps.day.outputs.go == 'true'
        run: pnpm install --frozen-lockfile
      - name: Write articles
        id: write
        if: steps.day.outputs.go == 'true'
        # a failed topic (no credits, quality gate) must not lose the ones that worked: commit them, fail at the end
        continue-on-error: true
        env:
          COUNT: ${{ inputs.count || vars.BLOG_DAILY_COUNT || '1' }}
          CATEGORY: ${{ inputs.category }}
          TOPIC: ${{ inputs.topic }}
        run: |
          set -- --count "$COUNT"
          [ -n "$CATEGORY" ] && set -- "$@" --category "$CATEGORY"
          [ -n "$TOPIC" ] && set -- "$@" --topic "$TOPIC"
          pnpm blog:write "$@"
      - name: Check the blog still loads
        if: steps.day.outputs.go == 'true'
        run: pnpm vitest run tests/unit/blog.test.ts
      - name: Commit and push
        id: push
        if: steps.day.outputs.go == 'true'
        run: |
          git add blog public/blog
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          # Vercel (Hobby) deploys only commits by the project owner's git identity
          git config user.name "${{ vars.BLOG_GIT_NAME || 'yaroslav' }}"
          git config user.email "${{ vars.BLOG_GIT_EMAIL || 'yaroslav7v@gmail.com' }}"
          git commit -m "Blog: $(git diff --cached --name-only -- blog/uk | sed 's|blog/uk/||; s|\.md$||' | paste -sd ', ' -)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "paths=$(git diff --name-only HEAD~1 -- blog/uk | sed 's|blog/uk/|/blog/|; s|\.md$||' | paste -sd ' ' -)" >> "$GITHUB_OUTPUT"
      - name: Ping IndexNow once the deploy is live
        if: steps.push.outputs.paths != ''
        run: pnpm indexnow --wait ${{ steps.push.outputs.paths }}
      - name: Report failed topics
        if: steps.write.outcome == 'failure'
        run: |
          echo "::error::Some articles were not written — see the «Write articles» step (API credits? quality gate?)"
          exit 1
