title: Deutsch A1 → C2
subtitle: Уся німецька — від умлаутів до вільного C2, плюс історія й культура Німеччини
description: >-
  Німецька від першого «Hallo» до рівня носія: граматика без прогалин (артиклі, відмінки, порядок слів, Konjunktiv),
  слова з артиклем і множиною, вимова, аудіювання й читання, ситуації з життя в Німеччині, Австрії та Швейцарії,
  підготовка до Goethe, telc і TestDaF — і окремий посібник про історію й культуру Німеччини.
