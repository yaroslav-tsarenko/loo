# Levelup course manifest — docs/COURSE_FORMAT.md, docs/LANGUAGE_COURSE.md (interview-preparation-2-0)
# Full map of the course (all levels, topics, counts) — docs/ENGLISH_SYLLABUS.md.
# Official course: `from:` resolves against the vault's shared Guides/ folder (Guides/English/).
#
# Topic numbering: files are named `English - <LEVEL> - NN. <Назва>.md`; the name parser reads it as <level>×100 + NN
# (A1 → 101…, A2 → 201…, B1 → 301…, B2 → 401…, C1 → 501…, C2 → 601…) and sections pick topics by that number.
# Frontmatter `order:` (same numbers) still works and wins when present.
#
# All six levels A1–C2 are active (B2 ≈ IELTS 5.5–6.5, C1 ≈ IELTS 7.0–8.0, C2 ≈ IELTS 8.5–9.0; docs/ENGLISH_SYLLABUS.md §8).
# A section that is still being written gets `status: planned` — shown on the path as «скоро» without requiring its articles;
# drop it when the articles land (topics are picked by `chapters:`). Next: a separate IELTS section (§8.3), planned.
id: english-a1-c2
version: 0.1.0
title: English A1 → C2
subtitle: Уся англійська — від алфавіту й звуків до вільного C2
description: >-
  Один великий курс англійської для україномовних: граматика (усі часи, частини мови, структури речень), лексика за
  темами, фразові дієслова й ідіоми, вимова (звуки, IPA, дифтонги, наголос, інтонація, звʼязне мовлення),
  аудіювання, читання, письмо і реальні ситуації. Шість рівнів CEFR — від A1 до C2; рівень визначає вступний тест
  або вибір учня. Пояснення українською, приклади англійською.
subject: language
# Shell: course kind, practice sections (sidebar order) and the guides of the sidebar «Теорія» — COURSE_FORMAT §2.1
kind: language
practice: [path, words, listening, pronunciation, grammar, mistakes]
theory: [English]
# `language` — the language of instruction (explanations, UI); `target` — the language being learned: speech synthesis
# and recognition use it (docs/SPEECH.md), with the learner's accent setting (en-GB / en-US).
language: uk
target: en
# CEFR → IELTS (Cambridge / British Council alignment): the placement result, the per-skill card and the test summary
# show «IELTS ~<band>» — docs/LANGUAGE_COURSE.md «Нова мова: що задати».
exam:
  id: ielts
  name: IELTS
  below: 'нижче 4.0'
  bands: { B1: '4.0–5.0', B2: '5.5–6.5', C1: '7.0–8.0', C2: '8.5–9.0' }
  note: 'Лише орієнтир за шкалою Cambridge / British Council. IELTS ще оцінює письмо й говоріння — цей тест їх не перевіряє.'
icon: px:flagUk
color: '#2B59C3'
# CEFR ladder of language courses (labels «A1 · Початковий» …); placement probes the levels of active sections.
levels: [A1, A2, B1, B2, C1, C2]
tags: [english, cefr, grammar, vocabulary, pronunciation, listening, speaking, reading, writing]
authors: [{ name: Yaroslav Tsarenko }]
license: proprietary

